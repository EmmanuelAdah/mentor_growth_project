server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: mentor-growth

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile, email
            redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URL}


  datasource:
    url: ${DATASOURCE_URL:${LOCAL_DB_URL:jdbc:postgresql://localhost:5432/mentor_growth}}
    username: ${DATASOURCE_USERNAME:${LOCAL_DB_USERNAME:postgres}}
    password: ${DATASOURCE_PASSWORD:${LOCAL_DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: default
      password: ${REDIS_PASSWORD}
      timeout: 60000
      database: 0

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  rabbitmq:
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    port: ${RABBITMQ_PORT}
    host: ${RABBITMQ_HOST}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health

paystack:
  apiKey: ${PAYSTACK_SECRET_KEY}
  uri: ${PAYSTACK_BASE_URI}

jwt:
  secret:
    key: ${JWT_SECRET_KEY}
  access-token-ttl-ms: ${JWT_ACCESS_TOKEN_TTL_MS:43200000}

cloudinary:
  cloud-name: ${CLOUDINARY_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

rabbitmq:
  exchange:
    name: ${RABBITMQ_EXCHANGE}
  queue:
    name: ${RABBITMQ_QUEUE}
  routing:
    key: ${RABBITMQ_ROUTING_KEY}

google:
  credentials: ${GOOGLE_APPLICATION_CREDENTIALS}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
